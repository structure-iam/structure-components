name: Publish npm — structure-components

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to bump into package.json (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: components, path: . }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${${ github.event.release.tag_name }}"
            VERSION=$(echo "$TAG" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+.*$" || echo "$TAG")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: |
          case "${{ matrix.name }}" in
            portal-shell|shell|portal|amis*) npm install --legacy-peer-deps ;;
            *) npm install ;;
          esac
      - name: Bump version
        working-directory: ${{ matrix.path }}
        run: |
          CURRENT=$(jq -r '.version' package.json)
          echo "Current: $CURRENT → Target: $VERSION"
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version --no-git-tag-version "$VERSION"
          fi
      - name: Build
        working-directory: ${{ matrix.path }}
        run: npm run build --if-present
      - name: Publish to npm
        working-directory: ${{ matrix.path }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
